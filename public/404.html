<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="This Khoj page does not exist." />
    <meta name="theme-color" content="#fafaf9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found | Khoj</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --canvas: #fafaf9;
        --surface: #ffffff;
        --ink: #1a1a1e;
        --muted: #6f6f78;
        --line: rgb(9 9 11 / 0.08);
        --accent: #5b5bd6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --canvas: #000000;
          --surface: #181818;
          --ink: #ededf0;
          --muted: #9b9b9b;
          --line: rgb(255 255 255 / 0.1);
          --accent: #a7a3ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        min-height: 100dvh;
        flex-direction: column;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family:
          "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        font-size: 16px;
        line-height: 24px;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: inherit;
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      a:active {
        opacity: 0.8;
      }

      .page {
        display: flex;
        flex: 1;
        flex-direction: column;
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
        padding: 24px 24px 64px;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 24px 0;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        transition: color 300ms cubic-bezier(0.32, 0.72, 0, 1);
      }

      .brand:hover {
        color: var(--accent);
      }

      .back {
        padding: 4px 8px;
        border-radius: 8px;
        color: var(--muted);
        font-size: 14px;
        text-decoration: none;
      }

      .back:hover {
        background: var(--surface);
        color: var(--ink);
      }

      main {
        display: flex;
        flex: 1;
        flex-direction: column;
        justify-content: center;
        padding: 64px 0;
      }

      .code {
        margin: 0;
        color: var(--accent);
        font-size: 14px;
        font-weight: 600;
      }

      h1 {
        margin: 12px 0 0;
        font-size: 36px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 40px;
        text-wrap: balance;
      }

      p {
        margin: 12px 0 0;
        max-width: 42ch;
        color: var(--muted);
        text-wrap: pretty;
      }

      .search {
        display: inline-flex;
        width: max-content;
        margin-top: 32px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--ink);
        color: var(--canvas);
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
      }

      .search:hover {
        opacity: 0.9;
      }

      footer {
        padding-top: 24px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="top">
        <a class="brand" href="/">Khoj</a>
        <a class="back" href="/">Back to search</a>
      </header>

      <main>
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>
          The page you are looking for does not exist. Head back to the search
          and start from the top.
        </p>
        <a class="search" href="/">Back to search</a>
      </main>

      <footer>© 2026 Khoj</footer>
    </div>
  </body>
</html>
